name: Weekly ToC Digest

on:
  schedule:
    # Mondays 08:00 America/Los_Angeles. GitHub cron is UTC and does NOT observe DST,
    # so this is 08:00 PDT / 07:00 PST. Adjust if you care about the winter hour.
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keyword-only scoring, no API calls"
        type: boolean
        default: false
      lookback_days:
        description: "Lookback window in days"
        type: string
        default: "7"

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          MODEL_CHAIN: ${{ vars.MODEL_CHAIN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          PREFILTER_KEEP_TOP: "220"
          BATCH_SIZE: "40"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python digest.py --dry-run
          else
            python digest.py
          fi

      - name: Show digest summary
        run: |
          echo "### Digest preview" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -25 digest.md >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit digest.md
        run: |
          git config user.name  "toc-digest-bot"
          git config user.email "toc-digest-bot@users.noreply.github.com"
          git add digest.md
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m "Update weekly ToC digest ($(date -u +%Y-%m-%d))"
          git push
